<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Museum-RAG">
  <style>
    .shield { fill: #fae8e9; stroke: #9e1b22; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .pages  { fill: #ffffff; stroke: #9e1b22; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .leaf   { fill: #287a58; }
    .stem   { fill: none; stroke: #1b5e43; stroke-width: 2.4; stroke-linecap: round; }
    .node1  { fill: #e09f24; stroke: #9e1b22; stroke-width: 1.5; }
    .node2  { fill: #f2c94c; }
    .node3  { fill: #287a58; }
    @media (prefers-reduced-motion: no-preference) {
      .float  { animation: rise 5.2s ease-in-out infinite; }
      .f2     { animation-delay: 1.7s; }
      .f3     { animation-delay: 3.4s; }
      @keyframes rise {
        0%   { transform: translateY(0);    opacity: .35; }
        30%  { opacity: 1; }
        80%  { opacity: .85; }
        100% { transform: translateY(-6px); opacity: .25; }
      }
    }
  </style>
  <!-- Wappenschild-Kontur im Hintergrund -->
  <path class="shield" d="M9 8 H39 V25 C39 35 24 42.5 24 42.5 C24 42.5 9 35 9 25 Z"/>
  <!-- Offenes Archivbuch im unteren Bereich -->
  <path class="pages" d="M12 22 C16 20.5 21 21.5 24 23.5 C27 21.5 32 20.5 36 22 V33.5 C32 32 27 33 24 35 C21 33 16 32 12 33.5 Z"/>
  <path class="pages" d="M24 23.5 V35"/>
  <!-- Grüne Blätter / Verbindungen (Anlehnung an Wappen & Struktur) -->
  <path class="stem" d="M24 23 V15 M24 19 L18.5 15.5 M24 19 L29.5 15.5"/>
  <ellipse class="leaf" cx="17.5" cy="14.8" rx="2.6" ry="1.6" transform="rotate(-25 17.5 14.8)"/>
  <ellipse class="leaf" cx="30.5" cy="14.8" rx="2.6" ry="1.6" transform="rotate(25 30.5 14.8)"/>
  <!-- Goldene und grüne Wissens-Knoten (RAG-Vektoren & Wappenrose) -->
  <circle class="node1 float" cx="24" cy="13.5" r="3.1"/>
  <circle class="node2 float f2" cx="19" cy="10.2" r="1.6"/>
  <circle class="node3 float f3" cx="29" cy="10.2" r="1.6"/>
</svg>
